name: Native iOS build and UI test
on: push: branches: - main pull_request: branches: - main workflow_dispatch:
permissions: contents: read
jobs: build-and-test: name: Build and test on cloud macOS runs-on: macos-26-intel timeout-minutes: 40 steps: - name: Check out repository uses: actions/checkout@v4
  - name: Show toolchain versions
    run: |
      sw_vers
      xcodebuild -version
      swift --version

  - name: Install XcodeGen
    run: |
      brew install xcodegen

  - name: Generate Xcode project
    run: |
      xcodegen generate

  - name: Run iOS simulator build and tests
    run: |
      set -o pipefail
      xcodebuild test \
        -project CounterApp.xcodeproj \
        -scheme CounterApp \
        -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
        | xcbeautify || true
